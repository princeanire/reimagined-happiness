name: Kiro Terraform Dependency Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          # Uncomment once testing against a private registry:
          # cli_config_credentials_token: ${{ secrets.TERRAFORM_REGISTRY_ACCESS }}

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.tf' > pr.diff
          echo "diff_lines=$(wc -l < pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Run Kiro dependency review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          cat pr.diff | kiro-cli chat --no-interactive --trust-all-tools "
          This PR bumps a Terraform provider or module version via Dependabot.
          The diff of the changed .tf files is provided as input above.

          Do the following three things, in order:
          1. Fetch the changelog or release notes for the changed provider/module
             between the old and new version (check the source registry or
             GitHub releases page). Flag anything marked as breaking.
          2. Run \`terraform init\` in this directory and report whether it succeeds.
          3. Run \`terraform validate\` and report whether it succeeds, including
             any error output.

          Respond in this exact format:

          ## Changelog Summary
          <bullet list of relevant changes between old and new version>

          ## terraform init
          Status: <pass/fail>
          <relevant output if failed>

          ## terraform validate
          Status: <pass/fail>
          <relevant output if failed>
          " > kiro-raw.txt 2>&1

      - name: Clean Kiro output
        run: |
          # Strip ANSI escape sequences (colors, cursor codes, etc.)
          sed -E $'s/\x1b\[[0-9;]*[a-zA-Z]//g' kiro-raw.txt > kiro-stripped.txt

          # Keep only from the first "## Changelog Summary" heading onward,
          # dropping tool-invocation logs / preamble noise above it
          awk '/^## Changelog Summary/{found=1} found' kiro-stripped.txt > kiro-review.md

          # Fallback: if the heading was never found (unexpected output format),
          # just use the stripped output as-is rather than an empty file
          if [ ! -s kiro-review.md ]; then
            cp kiro-stripped.txt kiro-review.md
          fi

          echo "----- cleaned output -----"
          cat kiro-review.md

      - name: Check review status
        id: status
        run: |
          if grep -qi "Status: fail" kiro-review.md; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('kiro-review.md', 'utf8');
            const failed = "${{ steps.status.outputs.failed }}" === "true";
            const header = failed
              ? "## 🤖 Kiro Dependency Review — ⚠️ Issues Found"
              : "## 🤖 Kiro Dependency Review — ✅ Checks Passed";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${header}\n\n${body}`
            });

      - name: Request changes if checks failed
        if: steps.status.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'REQUEST_CHANGES',
              body: 'Kiro dependency review found failing checks (terraform init/validate or a breaking changelog entry). See the review comment above for details.'
            });

      - name: Fail job if checks failed
        if: steps.status.outputs.failed == 'true'
        run: |
          echo "::error::Kiro dependency review found failing terraform init/validate checks."
          exit 1
          